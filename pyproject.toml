[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oscal-agent-guardrails"
version = "0.1.0"
description = "Use OSCAL as a policy brain to guardrail LLM agents"
readme = "README.md"
license = {text = "Apache 2.0"}
requires-python = ">=3.10"
dependencies = [
    "langgraph==1.2.19",
    "langchain==1.4.8",
    "langchain-openai==1.7.3",
    "pydantic==2.14.2",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "black==26.10.1",
    "ruff==0.17.3",
]

[project.scripts]
oscal-guardrails = "oscal_guardrails.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
